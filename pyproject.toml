[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 正式定名 Foam(2026-08-22;显示名在 __app_name__,本文件为包名/命令名唯一来源)。
name = "foam"
version = "0.1.0"
description = "Foam — a Kali-native LLM harness for authorized security testing"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["kali", "llm", "agent", "harness", "authorized-security-testing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# 依赖保持保守(长期目标:进 Kali/Debian 官方源);新增依赖须在该 WP 日志说明理由。
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
foam = "foam.cli:main"
fm = "foam.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/foam"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
# src 布局下让测试直接导入本包(WP-01 声明:共享 .venv 的 editable .pth
# 在并发开发时不稳,见 docs/dev-logs/WP-01.md「踩坑」)。
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]

# pytest 代码不可能不用 assert(S101 误报),测试目录豁免;源码目录仍全量受检。
# (WP-02 添加,见 docs/dev-logs/WP-02.md「对共享/非拥有文件的改动」)
# 测试里的小文件阻塞读取是有意为之, trio/anyio Path 非依赖目标 → ASYNC230/240 豁免。
# (WP-01 添加,见 docs/dev-logs/WP-01.md「对共享/非拥有文件的改动」)
# fixture 凭据按契约必须明显合成(TESTONLY/example.com),硬编码即正确写法 → S105/106 豁免。
# (WP-06 添加,见 docs/dev-logs/WP-06.md「对共享/非拥有文件的改动」)
[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "ASYNC230", "ASYNC240", "S105", "S106"]
