[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
# 注意:名称为暂用代号,任何阶段可整体改名——见 README「命名纪律」。
name = "kalicode"
version = "0.0.1"
description = "A Kali-native LLM harness for authorized security testing (codename; subject to rename)"
readme = "README.md"
license = "GPL-3.0-only"
license-files = ["LICENSE"]
requires-python = ">=3.12"
keywords = ["kali", "llm", "agent", "harness", "authorized-security-testing"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Environment :: Console",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: GNU General Public License v3 (GPLv3)",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3.12",
    "Topic :: Security",
]
# 依赖保持保守(长期目标:进 Kali/Debian 官方源);新增依赖须在该 WP 日志说明理由。
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "textual>=0.86",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.6",
]

[project.scripts]
kalicode = "kalicode.cli:main"
kc = "kalicode.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/kalicode"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC", "S"]
